<style>
  .catalog {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 2rem;
    padding: 2rem;
    max-width: 1400px;
    margin: 0 auto;
  }

  .release {
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 12px;
    padding: .5rem;
    box-shadow: 0 0 15px rgba(255, 0, 128, 0.2);
    display: flex;
    flex-direction: column;
  }

  .release h2 {
    text-align: center;
    font-size: 1.2rem;
    margin-bottom: 0.5rem;
    color: #F55614;
  }

  .release p {
    font-size: 0.9rem;
    text-align: center;
    margin-bottom: 1rem;
    color: #ccc;
  }

  /* responsive embed wrapper */
  .release-embed {
    position: relative;
    width: 100%;
    padding-top: 100%;
  }

  .release-embed iframe,
.release-embed img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover; /* ensures the image fills nicely */
  border: none;
}

  /* buttons */
  .release-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    margin-top: 1rem;
  }

  .release-buttons a {
    flex: 1;
    min-width: 120px;
    text-align: center;
    padding: 0.6rem 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.3s ease, transform 0.2s ease;
  }

  .release-buttons a.purchase {
    background: var(--highlight-green, #679D22);
    color: #fff;
  }

  .release-buttons a.purchase:hover {
    background: #56831c;
    transform: translateY(-2px);
  }

  .release-buttons a.stream {
    background: var(--highlight-red, #F55614);
    color: #fff;
  }

  .release-buttons a.stream:hover {
    background: #d64710;
    transform: translateY(-2px);
  }
@media (max-width: 1280px) {
  .catalog {
    grid-template-columns: 1fr;
    gap: 1.5rem;
  }
}

@media (max-width: 400px) {
  .catalog {
    grid-template-columns: 1fr;
    gap: 1.25rem;
    padding: 1rem;
  }

  .release h2 {
    font-size: 1rem;
  }
}

</style>
