#countdown {
  font-family: 'monospace', monospace;
  font-size: clamp(18px, 5vw, 24px); /* min 18px, max 24px, scales with viewport width */
  font-weight: bold;
  color: #f3acac; 
  text-align: center;
  background-color: #111; /* dark “screen” background */
  padding: 20px 40px;
  border-radius: 12px;
  box-shadow: 0 0 20px #56bd19, 0 0 40px #56bd19 inset;

/* Flicker effect for the screen */

  0%, 19%, 21%, 23%, 25%, 54%, 56%, 100% { opacity: 1; }
  20%, 22%, 24%, 55% { opacity: 0.4; }
}

.melting-text {
  font-size: clamp(24px, 6vw, 48px); /* Min 24px, scales with viewport, max 48px */
  text-align: center;
  line-height: 1.2;
  font-weight: bold;
  color: #341912;
}
</style>

<script>
const targetDate = new Date("2025-10-17T00:00:00").getTime();
const countdownElement = document.getElementById("countdown");

const timer = setInterval(() => {
  const now = new Date().getTime();
  const distance = targetDate - now;

  if (distance < 0) {
    clearInterval(timer);
    countdownElement.innerHTML = "EVERY RAT IS OUT NOW! 🐀";
    return;
  }

  const days = Math.floor(distance / (1000 * 60 * 60 * 24));
  const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
  const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((distance % (1000 * 60)) / 1000);

  countdownElement.innerHTML = `
    THE RATS ARE COMING <br> TO CLEAN YOUR TEETH
    <br>
    ${days}d ${hours}h ${minutes}m ${seconds}s
  `;
}, 1000);

</script>
