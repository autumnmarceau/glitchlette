  <style>
:root {
  --red-primary: #BD400D;
  --red-dark: #7a0d60;
  --red-shadow: #a30b57;
  --red-gradient-start: #899b02;
  --red-gradient-end: #414a02;
  --text-light: #FAEBB3;
  --link-text: #DA9C9C;
  --background-dark: #2E130B;
}

.lynch-player {
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(
    135deg,
    var(--red-gradient-start),
    var(--red-gradient-end)
  );
  padding: 2rem;
  border-radius: 2rem;
  box-shadow: 0 0 25px var(--red-shadow),
              inset 0 0 10px rgba(255,255,255,0.15);
  position: relative;
  overflow: hidden;
}

.lynch-player::before {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle at 20% 20%, rgba(255,192,203,0.1), transparent 70%);
  mix-blend-mode: screen;
  pointer-events: none;
}

.lynch-player audio {
  width: 100%;
  max-width: 400px;
  accent-color: var(--red-primary);
  filter: brightness(1.1) saturate(1.2);
  border-radius: 1rem;
}

/* Girly-pop dream tweaks */
.lynch-player audio::-webkit-media-controls-panel {
  background-color: rgba(46, 19, 11, 0.8);
  border-radius: 1rem;
  box-shadow: 0 0 10px var(--red-shadow);
}

.lynch-player audio::-webkit-media-controls-play-button {
  background-color: var(--link-text);
  border-radius: 50%;
  transition: transform 0.2s ease, background 0.3s ease;
}
.lynch-player audio::-webkit-media-controls-play-button:hover {
  transform: scale(1.2) rotate(10deg);
  background-color: var(--red-dark);
}

.lynch-player audio::-webkit-media-controls-current-time-display,
.lynch-player audio::-webkit-media-controls-time-remaining-display {
  color: var(--text-light);
  font-family: "DM Sans", sans-serif;
  font-weight: 500;
}

/* Responsiveness */
@media (max-width: 600px) {
  .lynch-player {
    padding: 1rem;
    border-radius: 1rem;
  }
  .lynch-player audio {
    max-width: 90%;
  }
}

</style>
