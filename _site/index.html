.glitch-button {
  position: relative;
  display: inline-block;
  padding: 14px 38px;
  font-family: 'Orbitron', sans-serif;
  font-size: 1.2rem;
  text-transform: uppercase;
  color: #fff;
  background: #000;
  border: 2px solid #ff003c;
  overflow: hidden;
  cursor: pointer;
  text-decoration: none;
  transition: 0.2s ease;
}

.glitch-button::before,
.glitch-button::after {
  content: 'PRE-SAVE';
  position: absolute;
  left: 0;
  width: 100%;
  height: 100%;
  text-align: center;
  top: 0;
  color: #ff003c;
  background: #000;
  clip: rect(0, 0, 0, 0);
}

.glitch-button::before {
  animation: glitchTop 1.8s infinite linear alternate-reverse;
}

.glitch-button::after {
  color: #00fff9;
  animation: glitchBottom 2.1s infinite linear alternate-reverse;
}

.glitch-button:hover {
  background: #ff003c;
  color: #000;
  text-shadow: 0 0 8px #fff;
}

@keyframes glitchTop {
  0% { clip: rect(2px, 9999px, 8px, 0); transform: translate(-2px, -2px); }
  20% { clip: rect(12px, 9999px, 20px, 0); transform: translate(2px, 2px); }

  100% { clip: rect(10px, 9999px, 20px, 0); transform: translate(0); }
}

@keyframes glitchBottom {
  0% { clip: rect(22px, 9999px, 28px, 0); transform: translate(2px, 2px); }
