<link
  rel="stylesheet"

/>

  <style>
  /* Cards and grids */
    .hero {
  max-width: 100%;        /* fixed invalid flex value */
  display: block;
  border-radius: 8px;
  margin-bottom: 8px;
}

.tagline {
  margin-bottom: 10px;
  font-family: 'Halloween', serif;
  font-size: 25px;
  text-align: center;      /* fixed text centering */
}

.socials {
  margin-bottom: 30px;
}

.socials a {
  margin-right: 15px;
  text-decoration: none;
  font-weight: bold;
}

.socials svg {
  margin-right: 15px;
  fill: white;   /* or currentColor to match text color */
  transition: transform 0.2s;
  width: 40px;   /* increase size */
  height: 40px;
}
.socials svg:hover {
  transform: scale(2.2);
  fill: #ee2222; /* optional hover color */
}


.card {
  position: relative;
  width: 100%;    /* portrait ratio for photos */
  overflow: hidden;
  border-radius: 8px;
  margin-bottom: 5px;
}
 .card img {aspect-ratio: 3 / 4; }

.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 10px;
}

.grid img {
  width: 100%;
  height: 100%;
  object-fit: cover;       /* crop instead of squish */
  border-radius: 8px;
}

.quote {
  font-family: 'Spectral', serif;  /* added missing semicolon */
  padding: 10px;
  background: var(--background-dark);
  text-align: center;      /* fixed alignment */
}



</style>
</head>
